---
- hosts: all

  tasks:
    - name: Gather service facts
      service_facts:

    - name: Open HTTP(S) ports, if firewalld is active
      firewalld:
        service: "{{item}}"
        state: enabled
        permanent: yes
        immediate: yes
      with_items: [ http, https ]
      when: >
        ansible_facts['services']['firewalld.service'] is defined
          and
        ansible_facts['services']['firewalld.service']['state'] == "running"
