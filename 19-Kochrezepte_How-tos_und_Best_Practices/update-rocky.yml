---
- hosts:
    - rocky

  tasks:
    - name: Update all packages
      dnf:
        name: '*'
        state: latest

    - name: Reboot required?
      command: dnf needs-restarting -r
      changed_when: false
      failed_when: false
      register: reboot_required

    - name: Reboot
      reboot:
      when: reboot_required.rc != 0
