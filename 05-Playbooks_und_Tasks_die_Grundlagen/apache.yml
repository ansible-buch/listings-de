---
- hosts: [debian, ubuntu]

  tasks:
    - name: Update package index
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install Apache package
      apt:
        name: apache2

    - name: Start service and enable start on boot
      service:
        name: apache2
        state: started
        enabled: yes

    - name: Upload minimal homepage
      copy:
        dest: /var/www/html/index.html
        mode: 0644
        content: |
          <!doctype html>
          <html>
            <head>
              <meta charset="utf-8">
              <title>Test</title>
            </head>
            <body>
              <h1>Welcome!</h1>
            </body>
          </html>
