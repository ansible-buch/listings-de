- hosts: localhost

  tasks:
    - name: Store list of .conf filenames in variable
      set_fact:
        configs: "{{ lookup('fileglob', '/etc/*.conf', wantlist=True) }}"

    - name: Create filelist
      copy:
        dest: /tmp/filelist.txt
        content: |
          Found the following files:
          ==========================
          {% for file in configs %}
          - {{ file }}
          {% endfor %}


    - name: Delete all .bak and .old files from home directory
      file:
        path: "{{item}}"
        state: absent
      with_fileglob:
        - ~/*.bak
        - ~/*.old
