---
- hosts: ubuntu

  vars:
    network_name:      dbnet
    volume_name:       mariadb_data
    db_admin_password: secret
    web_port:          8080

  tasks:
    - name: Create a dedicated network
      docker_network:
        name: "{{network_name}}"

    - name: Create volume for MariaDB data
      docker_volume:
        name: "{{volume_name}}"


    - name: Create MariaDB container
      docker_container:
        name: mariadb
        image: mariadb
        networks:
          - name: dbnet
        volumes:
          - "{{volume_name}}:/var/lib/mysql"
        restart_policy: unless-stopped
        env:
          MARIADB_ROOT_PASSWORD: "{{db_admin_password}}"

    - name: Create Adminer container
      docker_container:
        name: adminer
        image: adminer
        networks:
          - name: dbnet
        network_mode: default
        restart_policy: unless-stopped
        env:
          ADMINER_DEFAULT_SERVER: mariadb
        published_ports:
          - '{{web_port}}:8080'
