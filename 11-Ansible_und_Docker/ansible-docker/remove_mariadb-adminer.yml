---
- hosts: ubuntu

  vars:
    network_name:      dbnet
    volume_name:       mariadb_data
    remove_volume:     yes

  tasks:
    - name: Remove containers
      docker_container:
        name: "{{item}}"
        state: absent
      with_items:
        - mariadb
        - adminer

    - name: Remove network
      docker_network:
        name: "{{network_name}}"
        state: absent

    - name: Remove data volume
      docker_volume:
        name: "{{volume_name}}"
        state: absent
      when: remove_volume | bool
